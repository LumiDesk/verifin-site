    <script>
      ;(() => {
        try {
          const stored = localStorage.getItem('verifin-site:theme')
          const storedLocale = localStorage.getItem('verifin-site:locale')
          const dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)

          if (
            (storedLocale === 'en' || storedLocale === 'ja') &&
            window.location.pathname === '/'
          ) {
            window.location.replace(`/${storedLocale}`)
          }

          const localeSegment = window.location.pathname.split('/')[1]
          document.documentElement.lang =
            localeSegment === 'en' ? 'en' : localeSegment === 'ja' ? 'ja' : 'zh-CN'
          document.documentElement.classList.toggle('dark', dark)
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', dark ? '#0d1117' : '#f7f8f6')
        } catch {
          // Keep the light theme if storage is unavailable.
        }
      })()
    </script>
